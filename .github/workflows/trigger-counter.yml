name: Trigger counter update

on:
  push:
  page_build:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *" # co 5 minut (można zmienić)
  repository_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger counter workflow
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.everest-preview+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type": "visit"}'
